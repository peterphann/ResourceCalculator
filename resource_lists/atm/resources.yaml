authors:
  Peter: "https://peterphan.dev"

stack_sizes:
  Stack:
    quantity_multiplier: 64
    plural: Stacks
    extends_from: null

index_page_display_name: All the Mods 9 - To the Sky

game_version: Java 1.20.1

recipe_types:
  Crafting: Craft {IN_ITEMS} into {OUT_ITEM}
  Smelting: Smelt {IN_ITEMS} into {OUT_ITEM}
  Pulverizing: Pulverize {IN_ITEMS} into {OUT_ITEM}
  Induction Smelting: Induction smelt {IN_ITEMS} into {OUT_ITEM}
  Infusing: Infuse {IN_ITEMS} into {OUT_ITEM}
  Squeezing: Squeeze {IN_ITEMS} and dry into {OUT_ITEM}  
  Mechanical Squeezing: Mechanically squeeze {IN_ITEMS} into {OUT_ITEM}  
  Hammering: Hammer {IN_ITEMS} into {OUT_ITEM}
  Pressing: Press {IN_ITEMS} into {OUT_ITEM}
  Strip: Right click on {IN_ITEMS} with an Axe to strip it into {OUT_ITEM}
  Inscribing: Inscribe {IN_ITEMS} into {OUT_ITEM}
  Logic Inscribing: Inscribe {IN_ITEMS} with a Logic Press into {OUT_ITEM}
  Calculation Inscribing: Inscribe {IN_ITEMS} with a Calculation Press into {OUT_ITEM}
  Engineering Inscribing: Inscribe {IN_ITEMS} with an Engineering Press into {OUT_ITEM}
  Silicon Inscribing: Inscribe {IN_ITEMS} with a Silicon Press into {OUT_ITEM}
  Charging: Charge {IN_ITEMS} into {OUT_ITEM}
  Submerging: Submerge {IN_ITEMS} in Water into {OUT_ITEM}
  AE2 Cutting: Cut {IN_ITEMS} with a Quartz Cutting Knife into {OUT_ITEM}
  Combining: Combine {IN_ITEMS} into {OUT_ITEM}
  Compacting: Compact {IN_ITEMS} into {OUT_ITEM}
  Smithing Table: Use a smithing table to upgrade {IN_ITEMS} into {OUT_ITEM}
  Dissolving: Dissolve {IN_ITEMS} into {OUT_ITEM}

requirement_groups:
  Log:
  - Oak Log
  - Menril Log
  Planks:
  - Oak Planks
  - Menril Planks
  Stripped Log:
  - Stripped Oak Log
  Any Certus Quartz:
  - Certus Quartz Crystal
  - Charged Certus Quartz Crystal
  Metal Ingot:
  - Iron Ingot
  - Gold Ingot
